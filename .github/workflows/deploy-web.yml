name: Web build verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synesthesia-web-verification
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SYNESTHESIA_RUST_WEB_TOOLCHAIN: nightly-2026-08-07
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build verified Godot web artifact
        run: ./scripts/build-web-preview.sh
      - name: Upload web artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synesthesia-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
